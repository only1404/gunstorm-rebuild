name: Build GunStorm ARM64 APK (desde el ZIP)

on:
  workflow_dispatch:
  push:
    paths:
      - 'gunstorm-arm64-proyecto.zip'
      - 'gunstorm-arm64 v2.zip'
      - '.github/workflows/build-desde-zip.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extraer proyecto del ZIP
        run: |
          ZIP=''
          if [ -f 'gunstorm-arm64-proyecto.zip' ]; then ZIP='gunstorm-arm64-proyecto.zip'; fi
          if [ -z "$ZIP" ] && [ -f 'gunstorm-arm64 v2.zip' ]; then ZIP='gunstorm-arm64 v2.zip'; fi
          test -n "$ZIP" || { echo 'Sube gunstorm-arm64-proyecto.zip o gunstorm-arm64 v2.zip a la raíz del repositorio'; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -d extracted/gunstorm-arm64 || { echo 'El ZIP no contiene la carpeta esperada gunstorm-arm64/'; find extracted -maxdepth 2 -type d; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404"

      - name: Instalar NDK r17c y utilidades
        run: |
          curl -fL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r17c" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file patch

      - name: Descargar Cocos2d-x y dependencias
        working-directory: extracted/gunstorm-arm64
        run: |
          mkdir -p build-logs
          bash scripts/fetch_deps.sh 2>&1 | tee build-logs/01-fetch.log

      - name: Compatibilidad Cocos2d-x con Android moderno
        working-directory: extracted/gunstorm-arm64
        run: |
          FILE='third_party/cocos2d-x/cocos2dx/platform/android/java/src/org/cocos2dx/lib/Cocos2dxBitmap.java'
          test -f "$FILE" || { echo "No se encontró $FILE"; exit 1; }
          sed -i 's/FloatMath\.ceil/Math.ceil/g' "$FILE"
          grep -n 'Math.ceil' "$FILE"

      - name: Compilar librerías de terceros ARM64
        working-directory: extracted/gunstorm-arm64
        run: bash scripts/build_thirdparty.sh 2>&1 | tee build-logs/02-thirdparty.log

      - name: Compilar libgame.so ARM64
        working-directory: extracted/gunstorm-arm64
        run: bash scripts/build_native.sh 2>&1 | tee build-logs/03-native.log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generar APK debug
        working-directory: extracted/gunstorm-arm64
        run: gradle --no-daemon :app:assembleDebug 2>&1 | tee build-logs/04-gradle.log

      - name: Verificar APK
        working-directory: extracted/gunstorm-arm64
        run: bash scripts/verify_apk.sh 2>&1 | tee build-logs/05-verify.log

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: GunStorm-arm64-debug-apk
          path: extracted/gunstorm-arm64/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Subir logs aunque falle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: extracted/gunstorm-arm64/build-logs/
          if-no-files-found: warn
