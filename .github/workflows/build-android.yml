name: Build Gunstorm Android ARM64
on:
  workflow_dispatch:
  push:
    branches: [ main, master, principal ]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Godot project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f project.godot ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'Gunstorm_Reconstruccion_ARM64_lista_para_compilar.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: falta el ZIP del proyecto Godot en la raíz."
              exit 1
            fi
            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
          fi
          PROJECT_FILE="$(find . -path './.git' -prune -o -path './.github' -prune -o -name project.godot -type f -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: no se encontró project.godot después de extraer el ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_DIR"

      - name: Configure Android ARM64 export preset
        shell: bash
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/Gunstorm-Rebuilt-Android-ARM64.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.rebuild.gunstorm"
          package/name="Gunstorm Rebuilt"
          package/description="Reconstrucción jugable no oficial basada en recursos de GunStorm 1.0.3."
          package/short_name="GunStorm Rebuilt"
          version/code=1
          version/name="0.1.0"
          EOF
          mkdir -p "$PROJECT_DIR/build"

      - name: Import project resources
        run: godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Android ARM64 APK
        run: godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/Gunstorm-Rebuilt-Android-ARM64.apk"

      - name: Verify APK
        run: test -s "$PROJECT_DIR/build/Gunstorm-Rebuilt-Android-ARM64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gunstorm-Rebuilt-Android-ARM64
          path: ${{ env.PROJECT_DIR }}/build/Gunstorm-Rebuilt-Android-ARM64.apk
          if-no-files-found: error
